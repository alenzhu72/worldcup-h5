<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>世界杯热门球队阵容与比分预测</title>
  <style>
    :root {
      --bg: #f5f7fb;
      --ink: #101623;
      --muted: #687386;
      --line: #e4e8f0;
      --panel: #ffffff;
      --red: #e33d4f;
      --green: #1a9f75;
      --blue: #1769e0;
      --amber: #f0a328;
      --shadow: 0 14px 38px rgba(20, 31, 52, .10);
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", Arial, sans-serif;
    }

    .app {
      width: min(100%, 480px);
      min-height: 100vh;
      margin: 0 auto;
      background:
        linear-gradient(180deg, rgba(16, 32, 58, .95) 0, rgba(20, 46, 78, .92) 232px, transparent 233px),
        var(--bg);
      padding: env(safe-area-inset-top) 14px 92px;
    }

    header {
      padding: 18px 4px 10px;
      color: #fff;
    }

    .kicker {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      font-size: 12px;
      opacity: .78;
    }

    .lang-toggle {
      border: 1px solid rgba(255,255,255,.28);
      border-radius: 8px;
      background: rgba(255,255,255,.12);
      color: #fff;
      padding: 7px 9px;
      font-size: 12px;
      font-weight: 900;
      white-space: nowrap;
    }

    h1 {
      margin: 10px 0 14px;
      font-size: 28px;
      line-height: 1.12;
      letter-spacing: 0;
    }

    .hero-stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }

    .stat {
      border: 1px solid rgba(255,255,255,.16);
      background: rgba(255,255,255,.08);
      border-radius: 8px;
      padding: 10px 9px;
    }

    .stat b {
      display: block;
      font-size: 19px;
      line-height: 1;
    }

    .stat span {
      display: block;
      margin-top: 5px;
      font-size: 11px;
      color: rgba(255,255,255,.72);
      white-space: nowrap;
    }

    .searchbar {
      position: sticky;
      top: 0;
      z-index: 10;
      margin: 10px 0 12px;
      display: flex;
      gap: 8px;
      padding: 8px;
      border-radius: 10px;
      background: rgba(255,255,255,.96);
      box-shadow: var(--shadow);
    }

    .searchbar input {
      width: 100%;
      border: 0;
      outline: 0;
      font-size: 15px;
      background: transparent;
      padding: 8px 6px;
      color: var(--ink);
    }

    .tabs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin: 0 0 12px;
    }

    .tab {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      color: var(--muted);
      padding: 11px 10px;
      font-weight: 700;
      font-size: 14px;
    }

    .tab.active {
      background: var(--ink);
      color: #fff;
      border-color: var(--ink);
    }

    .team-strip {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding: 1px 0 12px;
      scroll-snap-type: x proximity;
      scrollbar-width: none;
    }

    .team-strip::-webkit-scrollbar { display: none; }

    .rank-row {
      position: relative;
      margin-bottom: 2px;
    }

    .rank-row::after {
      content: "";
      position: absolute;
      top: 0;
      right: 0;
      width: 32px;
      height: calc(100% - 12px);
      pointer-events: none;
      background: linear-gradient(90deg, rgba(245,247,251,0), var(--bg));
    }

    .rank-label {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin: 0 2px 8px;
      color: #3b4658;
      font-size: 12px;
      font-weight: 800;
    }

    .swipe-hint {
      color: var(--blue);
      font-weight: 900;
    }

    .team-pill {
      min-width: 92px;
      flex: 0 0 92px;
      scroll-snap-align: start;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      padding: 8px;
      text-align: left;
      color: var(--ink);
    }

    .team-pill.active {
      border-color: var(--blue);
      box-shadow: 0 0 0 2px rgba(23,105,224,.13);
    }

    .flag {
      width: 30px;
      height: 22px;
      object-fit: cover;
      border-radius: 3px;
      box-shadow: 0 0 0 1px rgba(0,0,0,.08);
      background: #eee;
      vertical-align: middle;
    }

    .pill-name {
      display: block;
      margin-top: 7px;
      font-weight: 800;
      font-size: 13px;
    }

    .pill-en {
      display: block;
      margin-top: 2px;
      color: var(--muted);
      font-size: 10px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .rank {
      font-size: 11px;
      color: var(--muted);
    }

    section { display: none; }
    section.active { display: block; }

    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: 0 10px 26px rgba(20,31,52,.06);
      margin-bottom: 12px;
      overflow: hidden;
    }

    .team-head {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px;
      border-bottom: 1px solid var(--line);
    }

    .team-head .flag {
      width: 52px;
      height: 37px;
      border-radius: 5px;
      flex: 0 0 auto;
    }

    .team-title {
      min-width: 0;
      flex: 1;
    }

    .team-title h2 {
      margin: 0;
      font-size: 21px;
      line-height: 1.12;
    }

    .meta {
      margin-top: 5px;
      color: var(--muted);
      font-size: 12px;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 34px;
      height: 34px;
      border-radius: 8px;
      background: #eef4ff;
      color: var(--blue);
      font-weight: 900;
    }

    .players {
      padding: 4px 0;
    }

    .player {
      display: grid;
      grid-template-columns: 42px minmax(0, 1fr) auto;
      gap: 9px;
      align-items: center;
      padding: 10px 14px;
      border-bottom: 1px solid #edf0f5;
    }

    .player:last-child { border-bottom: 0; }

    .num {
      width: 34px;
      height: 34px;
      display: grid;
      place-items: center;
      border-radius: 8px;
      background: #f1f4f8;
      color: #344055;
      font-weight: 900;
      font-size: 13px;
    }

    .shirt {
      width: 38px;
      height: 38px;
      display: grid;
      place-items: center;
      border-radius: 8px;
      background: var(--ink);
      color: #fff;
      font-weight: 950;
      font-size: 12px;
      line-height: 1.05;
    }

    .player b {
      display: block;
      font-size: 14px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .player span {
      display: block;
      margin-top: 3px;
      color: var(--muted);
      font-size: 12px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .player-en {
      color: #344055;
      font-weight: 700;
    }

    .club-line {
      color: var(--muted);
    }

    .pos {
      border-radius: 7px;
      padding: 5px 7px;
      font-size: 11px;
      font-weight: 800;
      color: #fff;
      background: var(--green);
    }

    .pos.fw { background: var(--red); }
    .pos.mf { background: var(--blue); }
    .pos.df { background: #59677c; }
    .pos.gk { background: var(--amber); color: #3b2a05; }

    .notice {
      margin: 0 0 12px;
      padding: 11px 12px;
      border-radius: 8px;
      background: #fff8e7;
      border: 1px solid #f5dfa5;
      color: #6c4c06;
      font-size: 12px;
      line-height: 1.5;
    }

    .account-panel, .stats-panel {
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 12px;
      box-shadow: 0 10px 26px rgba(20,31,52,.06);
    }

    .account-panel {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 8px;
      align-items: center;
    }

    .account-panel input {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 10px;
      font-size: 14px;
      outline: 0;
    }

    .account-panel button, .mini-btn {
      border: 0;
      border-radius: 8px;
      background: var(--blue);
      color: #fff;
      padding: 10px 12px;
      font-weight: 900;
      white-space: nowrap;
    }

    .mini-btn.secondary {
      background: #eef4ff;
      color: var(--blue);
    }

    .user-chip {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      grid-column: 1 / -1;
      color: var(--muted);
      font-size: 13px;
    }

    .user-chip b {
      color: var(--ink);
      font-size: 15px;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }

    .stats-grid div {
      border-radius: 8px;
      background: #f4f7fb;
      padding: 10px 8px;
      text-align: center;
    }

    .stats-grid b {
      display: block;
      font-size: 18px;
    }

    .stats-grid span {
      display: block;
      margin-top: 4px;
      color: var(--muted);
      font-size: 11px;
    }

    .match {
      padding: 12px;
      border-bottom: 1px solid var(--line);
    }

    .match:last-child { border-bottom: 0; }

    .match-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      color: var(--muted);
      font-size: 12px;
      margin-bottom: 10px;
    }

    .status {
      border-radius: 7px;
      padding: 4px 7px;
      background: #edf8f4;
      color: var(--green);
      font-weight: 800;
    }

    .status.future { background: #eef4ff; color: var(--blue); }

    .teams-row {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 8px;
    }

    .side {
      display: flex;
      align-items: center;
      gap: 7px;
      min-width: 0;
      font-weight: 900;
      font-size: 14px;
    }

    .side.away {
      justify-content: flex-end;
      text-align: right;
    }

    .side span {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .side-name {
      min-width: 0;
    }

    .side-name small {
      display: block;
      margin-top: 2px;
      color: var(--muted);
      font-size: 10px;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .score-box {
      min-width: 82px;
      text-align: center;
      font-size: 22px;
      font-weight: 950;
      letter-spacing: 0;
    }

    .predict {
      display: grid;
      grid-template-columns: 1fr 34px 1fr auto;
      gap: 8px;
      align-items: center;
      margin-top: 11px;
      padding-top: 11px;
      border-top: 1px dashed #d7dce6;
    }

    .predict input {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 9px 6px;
      text-align: center;
      font-size: 16px;
      font-weight: 900;
      outline: 0;
      background: #fbfcfe;
    }

    .predict button {
      border: 0;
      border-radius: 8px;
      background: var(--ink);
      color: #fff;
      padding: 10px 12px;
      font-weight: 900;
      white-space: nowrap;
    }

    .pred-text {
      margin-top: 8px;
      color: var(--muted);
      font-size: 12px;
    }

    .prediction-actions {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      margin-top: 8px;
    }

    .all-predictions {
      display: none;
      margin-top: 9px;
      border-radius: 8px;
      background: #f6f8fb;
      padding: 8px;
      color: #344055;
      font-size: 12px;
    }

    .all-predictions.open {
      display: block;
    }

    .prediction-row {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      padding: 6px 0;
      border-bottom: 1px solid #e6ebf2;
    }

    .prediction-row:last-child {
      border-bottom: 0;
    }

    .empty {
      padding: 22px 14px;
      color: var(--muted);
      text-align: center;
      font-size: 13px;
    }

    .bottom-nav {
      position: fixed;
      left: 50%;
      bottom: 0;
      transform: translateX(-50%);
      width: min(100%, 480px);
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      padding: 10px 14px calc(10px + env(safe-area-inset-bottom));
      background: rgba(245,247,251,.92);
      backdrop-filter: blur(14px);
      border-top: 1px solid rgba(215,220,230,.75);
    }

    .bottom-nav button {
      border: 0;
      border-radius: 8px;
      padding: 12px 10px;
      color: var(--muted);
      background: #fff;
      font-size: 14px;
      font-weight: 900;
      box-shadow: 0 8px 18px rgba(20,31,52,.08);
    }

    .bottom-nav button.active {
      background: var(--blue);
      color: #fff;
    }
  </style>
</head>
<body>
  <main class="app">
    <header>
      <div class="kicker">
        <span id="kickerLeft">FIFA 2026 · 热门球队数据库</span>
        <button id="langToggle" class="lang-toggle" type="button">中文</button>
      </div>
      <h1 id="heroTitle">世界杯球队人员<br />与比分预测</h1>
      <div class="hero-stats">
        <div class="stat"><b>40</b><span id="statTeams">排名热门队</span></div>
        <div class="stat"><b>640</b><span id="statPlayers">核心球员样例</span></div>
        <div class="stat"><b id="fixtureCount">104</b><span id="statMatches">赛程样例</span></div>
      </div>
    </header>

    <div class="searchbar">
      <input id="search" type="search" placeholder="搜索球队 / 球员 / 俱乐部" />
    </div>

    <div class="tabs" aria-label="页面视图">
      <button class="tab active" data-view="teams" id="teamsTab">球队人员</button>
      <button class="tab" data-view="matches" id="matchesTab">赛程比分</button>
    </div>

    <div class="rank-row">
      <div class="rank-label">
        <span id="rankTitle">世界排名 Top 40</span>
        <span class="swipe-hint" id="swipeHint">右滑查看更多</span>
      </div>
      <div id="teamStrip" class="team-strip"></div>
    </div>

    <section id="teamsView" class="active">
      <p class="notice" id="teamsNotice">数据说明：世界排名参考 FIFA 2026-06-11 男足排名；赛程/比分读取同目录 matches.json；球员名单为本项目手工维护数据，并非官方最终 26 人名单。球衣号码在官方名单公布前可能需要继续修正。</p>
      <div id="teamDetail"></div>
    </section>

    <section id="matchesView">
      <p class="notice" id="matchesNotice">登录只需要输入名字，不设密码。部署到服务器并启用 api.php 后，所有人的预测会共享保存；本机预览时会临时保存在浏览器里。</p>
      <div id="accountPanel" class="account-panel"></div>
      <div id="statsPanel" class="stats-panel"></div>
      <div id="matchList" class="panel"></div>
    </section>
  </main>

  <nav class="bottom-nav">
    <button class="active" data-view="teams" id="bottomTeams">球队</button>
    <button data-view="matches" id="bottomMatches">赛程</button>
  </nav>

  <script>
    const flag = code => `https://flagcdn.com/w80/${code}.png`;
    const posClass = p => ({ 前锋: 'fw', 中场: 'mf', 后卫: 'df', 门将: 'gk' }[p] || '');
    const posLabel = p => ({
      en: { 前锋: 'FW', 中场: 'MF', 后卫: 'DF', 门将: 'GK' },
      zh: { 前锋: '前锋', 中场: '中场', 后卫: '后卫', 门将: '门将' }
    }[lang]?.[p] || p);

    let lang = localStorage.getItem('wc_lang') || 'en';
    const i18n = {
      en: {
        kicker: 'FIFA 2026 · Popular Teams Database',
        toggle: '中文',
        hero: 'World Cup Squads<br />& Score Predictions',
        statTeams: 'Top-ranked teams',
        statPlayers: 'Player samples',
        statMatches: 'Fixture samples',
        search: 'Search team / player / club',
        teamsTab: 'Squads',
        matchesTab: 'Fixtures',
        rankTitle: 'FIFA Ranking Top 40',
        swipeHint: 'Swipe right for more',
        teamsNotice: 'Data note: rankings reference the FIFA men’s ranking published on 2026-06-11. Fixtures and scores are synchronized from ESPN into matches.json. Match times are shown in Singapore Time, UTC+8. Player squads are manually maintained project data, not official final 26-player lists.',
        matchesNotice: 'Login only requires a name, no password. After deploying api.php on the server, everyone’s predictions are shared; local preview temporarily saves predictions in this browser.',
        bottomTeams: 'Teams',
        bottomMatches: 'Fixtures',
        worldRank: 'FIFA rank',
        corePlayers: 'core players',
        noPlayer: 'No matching players',
        currentUser: 'Current user',
        switchUser: 'Switch',
        loginPlaceholder: 'Enter your name, e.g. Adam',
        login: 'Login',
        loginStats: 'Log in to track your prediction accuracy.',
        accuracy: 'Accuracy',
        exactHits: 'Exact scores',
        resultHits: 'Result hits',
        completed: 'Completed',
        upcoming: 'Upcoming',
        actualScore: 'Final score',
        save: 'Save',
        noPrediction: 'No prediction yet',
        loginToPredict: 'Log in to enter your prediction',
        yourPrediction: 'prediction',
        peoplePredicted: 'predictions',
        viewPredictions: 'View predictions',
        noOtherPredictions: 'No predictions yet',
        emptyMatches: 'No matching fixtures',
        pending: 'TBD',
        vs: 'VS',
        group: 'Group'
        ,timeZone: 'SGT (UTC+8)'
      },
      zh: {
        kicker: 'FIFA 2026 · 热门球队数据库',
        toggle: 'EN',
        hero: '世界杯球队人员<br />与比分预测',
        statTeams: '排名热门队',
        statPlayers: '核心球员样例',
        statMatches: '赛程样例',
        search: '搜索球队 / 球员 / 俱乐部',
        teamsTab: '球队人员',
        matchesTab: '赛程比分',
        rankTitle: '世界排名 Top 40',
        swipeHint: '右滑查看更多',
        teamsNotice: '数据说明：世界排名参考 FIFA 2026-06-11 男足排名；赛程和比分由 ESPN 同步到 matches.json；比赛时间统一显示为新加坡时间（UTC+8）；球员名单为本项目手工维护数据，并非官方最终 26 人名单。',
        matchesNotice: '登录只需要输入名字，不设密码。部署到服务器并启用 api.php 后，所有人的预测会共享保存；本机预览时会临时保存在浏览器里。',
        bottomTeams: '球队',
        bottomMatches: '赛程',
        worldRank: '世界排名',
        corePlayers: '名核心球员',
        noPlayer: '没有匹配的球员',
        currentUser: '当前用户',
        switchUser: '切换用户',
        loginPlaceholder: '输入名字，例如 Adam',
        login: '登录',
        loginStats: '登录后会统计你的预测准确率。',
        accuracy: '准确率',
        exactHits: '比分命中',
        resultHits: '胜平负命中',
        completed: '已完成',
        upcoming: '待开赛',
        actualScore: '实际比分',
        save: '保存',
        noPrediction: '还没有填写预测比分',
        loginToPredict: '请先登录后填写预测比分',
        yourPrediction: '的预测',
        peoplePredicted: '人已预测',
        viewPredictions: '查看其他预测',
        noOtherPredictions: '暂无其他预测',
        emptyMatches: '没有匹配的赛程',
        pending: '待定',
        vs: 'VS',
        group: 'Group'
        ,timeZone: '新加坡时间 UTC+8'
      }
    };
    const tr = key => i18n[lang][key] || i18n.en[key] || key;
    const primaryTeam = info => lang === 'en' ? info.en : info.name;
    const secondaryTeam = info => lang === 'en' ? info.name : info.en;
    const primaryPlayer = p => lang === 'en' ? playerEn(p[0]) : p[0];
    const secondaryPlayer = p => lang === 'en' ? p[0] : playerEn(p[0]);
    const displayDate = value => {
      if (lang !== 'en') return value;
      const match = String(value).match(/^(\d+)月(\d+)日$/);
      if (!match) return value;
      const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
      return `${months[Number(match[1]) - 1]} ${Number(match[2])}`;
    };

      '普利西奇':'Christian Pulisic','巴洛贡':'Folarin Balogun','雷纳':'Gio Reyna','麦肯尼':'Weston McKennie','穆萨':'Yunus Musah','亚当斯':'Tyler Adams','德斯特':'Sergino Dest','特纳':'Matt Turner','希门尼斯':'Raul Jimenez','洛萨诺':'Hirving Lozano',
      '三笘薰':'Kaoru Mitoma','久保建英':'Takefusa Kubo','堂安律':'Ritsu Doan','远藤航':'Wataru Endo','守田英正':'Hidemasa Morita','镰田大地':'Daichi Kamada','富安健洋':'Takehiro Tomiyasu','铃木彩艳':'Zion Suzuki',
      '马内':'Sadio Mane','尼古拉斯·杰克逊':'Nicolas Jackson','伊斯梅拉·萨尔':'Ismaila Sarr','库利巴利':'Kalidou Koulibaly','门迪':'Edouard Mendy','霍伊伦':'Rasmus Hojlund','埃里克森':'Christian Eriksen','霍伊别尔':'Pierre-Emile Hojbjerg','舒梅切尔':'Kasper Schmeichel',
      '塔雷米':'Mehdi Taremi','阿兹蒙':'Sardar Azmoun','孙兴慜':'Son Heung-min','黄喜灿':'Hwang Hee-chan','李刚仁':'Lee Kang-in','金玟哉':'Kim Min-jae','凯塞多':'Moises Caicedo','派斯':'Kendry Paez','辛卡皮耶':'Piero Hincapie',
      '多夫比克':'Artem Dovbyk','穆德里克':'Mykhailo Mudryk','津琴科':'Oleksandr Zinchenko','卢宁':'Andriy Lunin','居莱尔':'Arda Guler','恰尔汗奥卢':'Hakan Calhanoglu','莱万多夫斯基':'Robert Lewandowski','泽林斯基':'Piotr Zielinski',
      '伊萨克':'Alexander Isak','哲凯赖什':'Viktor Gyokeres','库卢塞夫斯基':'Dejan Kulusevski','索博斯洛伊':'Dominik Szoboszlai','弗拉霍维奇':'Dusan Vlahovic','米特罗维奇':'Aleksandar Mitrovic','萨拉赫':'Mohamed Salah','马尔穆什':'Omar Marmoush','阿菲夫':'Akram Afif',
      '戴维':'Jonathan David','戴维斯':'Alphonso Davies','哈兰德':'Erling Haaland','厄德高':'Martin Odegaard','希克':'Patrik Schick','奥斯梅恩':'Victor Osimhen','卢克曼':'Ademola Lookman','马赫雷斯':'Riyad Mahrez','麦克托米奈':'Scott McTominay','罗伯逊':'Andrew Robertson'
    };

    let selected = teams[0].code;
    let view = 'teams';
    let currentUser = localStorage.getItem('wc_current_user') || '';
    let allPredictions = JSON.parse(localStorage.getItem('wc_all_predictions_v1') || '{}');

    const $ = id => document.getElementById(id);
    const teamByCode = code => teams.find(t => t.code === code);
    const playerEn = name => playerEnglishNames[name] || 'English name to update';
    const cleanUser = name => name.trim().replace(/[^\w\u4e00-\u9fa5 .-]/g, '').slice(0, 24);
    const userPrediction = matchId => currentUser && allPredictions[matchId] ? allPredictions[matchId][currentUser] : null;
    const predictionUsers = matchId => allPredictions[matchId] ? Object.entries(allPredictions[matchId]) : [];
    const sameResult = (score, pred) => {
      const diff = Math.sign(Number(score[0]) - Number(score[1]));
      const predDiff = Math.sign(Number(pred[0]) - Number(pred[1]));
      return diff === predDiff;
    };

    function renderStaticText() {
      $('kickerLeft').innerHTML = tr('kicker');
      $('langToggle').textContent = tr('toggle');
      $('heroTitle').innerHTML = tr('hero');
      $('statTeams').textContent = tr('statTeams');
      $('statPlayers').textContent = tr('statPlayers');
      $('statMatches').textContent = tr('statMatches');
      $('search').placeholder = tr('search');
      $('teamsTab').textContent = tr('teamsTab');
      $('matchesTab').textContent = tr('matchesTab');
      $('rankTitle').textContent = tr('rankTitle');
      $('swipeHint').textContent = tr('swipeHint');
      $('teamsNotice').textContent = tr('teamsNotice');
      $('matchesNotice').textContent = tr('matchesNotice');
      $('bottomTeams').textContent = tr('bottomTeams');
      $('bottomMatches').textContent = tr('bottomMatches');
      document.documentElement.lang = lang === 'en' ? 'en' : 'zh-CN';
    }
    const infoByCode = (code, fallbackName = '') => {
      const t = teamByCode(code);
      if (t) return { name: t.name, en: t.en, flagCode: t.flagCode };
      const e = extraNames[code] || [fallbackName || code, fallbackName || code, 'un'];
      return { name: e[0], en: e[1], flagCode: e[2] };
    };

    function renderStrip() {
      const q = $('search').value.trim().toLowerCase();
      const filtered = teams.filter(t =>
        !q || t.name.toLowerCase().includes(q) || t.en.toLowerCase().includes(q) || t.players.some(p => p.join(' ').toLowerCase().includes(q))
      );
      $('teamStrip').innerHTML = filtered.map(t => `
        <button class="team-pill ${t.code === selected ? 'active' : ''}" data-team="${t.code}">
          <img class="flag" src="${flag(t.flagCode)}" alt="${t.name}">
          <span class="pill-name">${primaryTeam(t)}</span>
          <span class="pill-en">${secondaryTeam(t)}</span>
          <span class="rank">FIFA #${t.rank}</span>
        </button>`).join('');
      if (!filtered.some(t => t.code === selected) && filtered[0]) selected = filtered[0].code;
      document.querySelectorAll('.team-pill').forEach(btn => btn.onclick = () => {
        selected = btn.dataset.team;
        render();
      });
    }

    function renderTeam() {
      const q = $('search').value.trim().toLowerCase();
      const t = teamByCode(selected) || teams[0];
      const players = t.players.filter(p => !q || t.name.toLowerCase().includes(q) || t.en.toLowerCase().includes(q) || playerEn(p[0]).toLowerCase().includes(q) || p.join(' ').toLowerCase().includes(q));
      $('teamDetail').innerHTML = `
        <article class="panel">
          <div class="team-head">
            <img class="flag" src="${flag(t.flagCode)}" alt="${t.name}">
            <div class="team-title">
              <h2>${primaryTeam(t)} <span style="color:#8993a3;font-size:14px;">${secondaryTeam(t)}</span></h2>
              <div class="meta">${t.confed} · ${tr('worldRank')} #${t.rank} · ${t.players.length} ${tr('corePlayers')}</div>
            </div>
            <div class="badge">#${t.rank}</div>
          </div>
          <div class="players">
            ${players.length ? players.map((p, i) => `
              <div class="player">
                <div class="shirt">#${p[3] || tr('pending')}</div>
                <div><b>${primaryPlayer(p)}</b><span class="player-en">${secondaryPlayer(p)}</span><span class="club-line">${p[1]}</span></div>
                <em class="pos ${posClass(p[2])}">${posLabel(p[2])}</em>
              </div>`).join('') : `<div class="empty">${tr('noPlayer')}</div>`}
          </div>
        </article>`;
    }

    function renderAccount() {
      $('accountPanel').innerHTML = currentUser ? `
        <div class="user-chip">
          <span>${tr('currentUser')}: <b>${currentUser}</b></span>
          <button class="mini-btn secondary" id="logoutBtn">${tr('switchUser')}</button>
        </div>` : `
        <input id="loginName" placeholder="${tr('loginPlaceholder')}" maxlength="24">
        <button id="loginBtn">${tr('login')}</button>`;

      const loginBtn = $('loginBtn');
      if (loginBtn) loginBtn.onclick = () => {
        const name = cleanUser($('loginName').value);
        if (!name) return;
        currentUser = name;
        localStorage.setItem('wc_current_user', currentUser);
        render();
      };
      const logoutBtn = $('logoutBtn');
      if (logoutBtn) logoutBtn.onclick = () => {
        currentUser = '';
        localStorage.removeItem('wc_current_user');
        render();
      };
    }

    function renderStats() {
      if (!currentUser) {
        $('statsPanel').innerHTML = `<div class="pred-text">${tr('loginStats')}</div>`;
        return;
      }
      const completed = matches.filter(m => m.done && Array.isArray(m.score));
      const predictedCompleted = completed.filter(m => userPrediction(m.id));
      const exact = predictedCompleted.filter(m => {
        const pred = userPrediction(m.id);
        return Number(pred[0]) === Number(m.score[0]) && Number(pred[1]) === Number(m.score[1]);
      }).length;
      const resultHit = predictedCompleted.filter(m => sameResult(m.score, userPrediction(m.id))).length;
      const exactRate = predictedCompleted.length ? Math.round(exact / predictedCompleted.length * 100) : 0;
      $('statsPanel').innerHTML = `
        <div class="stats-grid">
          <div><b>${exactRate}%</b><span>${tr('accuracy')}</span></div>
          <div><b>${exact}/${predictedCompleted.length}</b><span>${tr('exactHits')}</span></div>
          <div><b>${resultHit}</b><span>${tr('resultHits')}</span></div>
        </div>`;
    }

    function renderMatches() {
      const q = $('search').value.trim().toLowerCase();
      const list = matches.filter(m => {
        const h = infoByCode(m.home, m.homeName), a = infoByCode(m.away, m.awayName);
        return !q || `${h.name} ${h.en} ${a.name} ${a.en} ${m.group}`.toLowerCase().includes(q);
      });
      $('matchList').innerHTML = list.length ? list.map(m => {
        const h = infoByCode(m.home, m.homeName), a = infoByCode(m.away, m.awayName);
        const pred = userPrediction(m.id) || ['', ''];
        const allRows = predictionUsers(m.id);
        const shown = m.done ? m.score : (pred[0] !== '' && pred[1] !== '' ? pred : ['-', '-']);
        const groupLabel = /^[A-L]$/.test(m.group) ? `${tr('group')} ${m.group}` : m.group;
        return `
          <div class="match">
            <div class="match-top">
              <span>${groupLabel} · ${displayDate(m.date)} ${displayTime(m.time)}</span>
              <span class="status ${m.done ? '' : 'future'}">${m.done ? tr('completed') : tr('upcoming')}</span>
            </div>
            <div class="teams-row">
              <div class="side"><img class="flag" src="${flag(h.flagCode)}" alt="${h.name}"><span class="side-name">${primaryTeam(h)}<small>${secondaryTeam(h)}</small></span></div>
              <div class="score-box">${shown[0]} : ${shown[1]}</div>
              <div class="side away"><span class="side-name">${primaryTeam(a)}<small>${secondaryTeam(a)}</small></span><img class="flag" src="${flag(a.flagCode)}" alt="${a.name}"></div>
            </div>
            ${m.done ? `<div class="pred-text">${tr('actualScore')}: ${primaryTeam(h)} ${m.score[0]}-${m.score[1]} ${primaryTeam(a)}</div>` : `
              <div class="predict">
                <input inputmode="numeric" pattern="[0-9]*" value="${pred[0]}" data-id="${m.id}" data-side="0" placeholder="${primaryTeam(h)}" ${currentUser ? '' : 'disabled'}>
                <span style="text-align:center;color:#8993a3;font-weight:900;">${tr('vs')}</span>
                <input inputmode="numeric" pattern="[0-9]*" value="${pred[1]}" data-id="${m.id}" data-side="1" placeholder="${primaryTeam(a)}" ${currentUser ? '' : 'disabled'}>
                <button data-save="${m.id}" ${currentUser ? '' : 'disabled'}>${tr('save')}</button>
              </div>
              <div class="pred-text">${currentUser ? (pred[0] !== '' && pred[1] !== '' ? `${currentUser} ${tr('yourPrediction')}: ${primaryTeam(h)} ${pred[0]}-${pred[1]} ${primaryTeam(a)}` : tr('noPrediction')) : tr('loginToPredict')}</div>`}
            <div class="prediction-actions">
              <span class="pred-text">${allRows.length} ${tr('peoplePredicted')}</span>
              <button class="mini-btn secondary" data-toggle-pred="${m.id}">${tr('viewPredictions')}</button>
            </div>
            <div class="all-predictions" id="pred-${m.id}">
              ${allRows.length ? allRows.map(([user, value]) => `<div class="prediction-row"><b>${user}</b><span>${primaryTeam(h)} ${value[0]}-${value[1]} ${primaryTeam(a)}</span></div>`).join('') : tr('noOtherPredictions')}
            </div>
          </div>`;
      }).join('') : `<div class="empty">${tr('emptyMatches')}</div>`;

      document.querySelectorAll('[data-save]').forEach(btn => btn.onclick = () => {
        const id = btn.dataset.save;
        const inputs = [...document.querySelectorAll(`input[data-id="${id}"]`)];
        const value = inputs.map(i => i.value.replace(/\D/g, '').slice(0, 2));
        savePrediction(id, value);
      });

      document.querySelectorAll('[data-toggle-pred]').forEach(btn => btn.onclick = () => {
        const box = document.getElementById(`pred-${btn.dataset.togglePred}`);
        if (box) box.classList.toggle('open');
      });
    }

    async function loadMatchesData() {
      try {
        const response = await fetch(`matches.json?v=${Date.now()}`, { cache: 'no-store' });
        if (!response.ok) return;
        const data = await response.json();
        if (Array.isArray(data) && data.length) matches = data;
        $('fixtureCount').textContent = matches.length;
      } catch (error) {
        matches = fallbackMatches;
        $('fixtureCount').textContent = matches.length;
      }
    }

    async function loadPredictionsData() {
      try {
        const response = await fetch('api.php?action=list', { cache: 'no-store' });
        if (!response.ok) return;
        const data = await response.json();
        if (data && data.ok && data.predictions) {
          allPredictions = data.predictions;
          localStorage.setItem('wc_all_predictions_v1', JSON.stringify(allPredictions));
        }
      } catch (error) {
        allPredictions = JSON.parse(localStorage.getItem('wc_all_predictions_v1') || '{}');
      }
    }

    async function savePrediction(matchId, value) {
      if (!currentUser || value[0] === '' || value[1] === '') return;
      allPredictions[matchId] = allPredictions[matchId] || {};
      allPredictions[matchId][currentUser] = value;
      localStorage.setItem('wc_all_predictions_v1', JSON.stringify(allPredictions));
      renderStats();
      renderMatches();

      try {
        await fetch('api.php', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ action: 'savePrediction', user: currentUser, matchId, score: value })
        });
        await loadPredictionsData();
        renderStats();
        renderMatches();
      } catch (error) {}
    }

    function setView(next) {
      view = next;
      document.querySelectorAll('.tab,.bottom-nav button').forEach(b => b.classList.toggle('active', b.dataset.view === view));
      $('teamsView').classList.toggle('active', view === 'teams');
      $('matchesView').classList.toggle('active', view === 'matches');
    }

    function render() {
      renderStaticText();
      renderStrip();
      renderTeam();
      renderAccount();
      renderStats();
      renderMatches();
      setView(view);
    }

    document.querySelectorAll('[data-view]').forEach(btn => btn.onclick = () => setView(btn.dataset.view));
    $('langToggle').onclick = () => {
      lang = lang === 'en' ? 'zh' : 'en';
      localStorage.setItem('wc_lang', lang);
      render();
    };
    $('search').addEventListener('input', render);
    Promise.all([loadMatchesData(), loadPredictionsData()]).finally(render);
  </script>
</body>
</html>
